name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # The core suite across the supported Python range (pyproject requires-python >= 3.10).
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .[dev]
      - run: ruff check .
      - run: pytest

  # The dbt extra (dbt-mode Ponds): the e2e importorskips without it, so exercise it explicitly.
  dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .[dev,dbt]
      - run: pytest -k dbt

  # Real-backend egress: the Postgres CDC driver against an actual Postgres (the DuckDB-attached
  # stand-in covers the SQL shape; only a real server proves the ATTACH + txn + watermark semantics).
  postgres-egress:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ds
          POSTGRES_PASSWORD: ds
          POSTGRES_DB: ds
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ds"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .[dev]
      - run: pytest tests/test_egress_postgres.py tests/test_egress_file.py tests/test_spout.py
        env:
          DUCKSTRING_TEST_PG: postgres://ds:ds@127.0.0.1:5432/ds

  # The object-store data plane against a REAL S3 (MinIO — unlike moto it REJECTS unsigned requests, so
  # this catches the credential class of bug, not just the code paths). Everything S3 was previously
  # proved by hand on a live AWS box, one session at a time; this is that, per commit, for free.
  object-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=duckstringtest -e MINIO_ROOT_PASSWORD=duckstringtest \
            quay.io/minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && break
            sleep 2
          done
      - run: pip install -e .[dev]
      - run: pytest tests/test_object_store.py -v
        env:
          DUCKSTRING_TEST_S3: http://127.0.0.1:9000
          DUCKSTRING_TEST_S3_KEY: duckstringtest
          DUCKSTRING_TEST_S3_SECRET: duckstringtest

  # The web UI: typecheck + the vitest unit suite (pure lib/component logic).
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
